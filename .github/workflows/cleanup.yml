name: Cleanup runs

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete old runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_DAYS: '1'
        run: |
          set -uo pipefail
          cutoff=$(date -u -d "-${KEEP_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          runs=$(gh api --paginate -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -f per_page=100 \
            --jq ".workflow_runs[] | select(.created_at < \"${cutoff}\" and .id != ${GITHUB_RUN_ID}) | \"\(.id) \(.status)\"")
          total=0
          failed=0
          while read -r id status; do
            [ -z "${id:-}" ] && continue
            total=$((total + 1))
            if [ "$status" != "completed" ]; then
              echo "run ${id} в статусе ${status} — отменяю"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel" --silent 2>&1 || true
              sleep 3
            fi
            ok=0
            for attempt in 1 2 3; do
              if out=$(gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --silent 2>&1); then
                ok=1; break
              fi
              # 404 = уже удалён, считаем успехом
              if echo "$out" | grep -q 'HTTP 404'; then ok=1; break; fi
              sleep $((attempt * 5))
            done
            if [ "$ok" -ne 1 ]; then
              failed=$((failed + 1))
              echo "::warning::не удалось удалить run ${id} (${status}): ${out}"
            fi
            sleep 0.3   # не упираться во вторичный rate limit
          done <<< "$runs"
          echo "найдено: ${total}, не удалось удалить: ${failed}"
          [ "$failed" -eq 0 ]
