name: Cleanup runs

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete old runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_DAYS: '1'
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${KEEP_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          ids=$(gh api --paginate -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -f per_page=100 -f status=completed -f created="<${cutoff}" \
            --jq '.workflow_runs[].id')
          total=0
          failed=0
          for id in $ids; do
            total=$((total + 1))
            if ! gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --silent 2>/dev/null; then
              sleep 2
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --silent 2>/dev/null || failed=$((failed + 1))
            fi
          done
          echo "найдено: ${total}, не удалось удалить: ${failed}"
          [ "$failed" -eq 0 ]
